<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscription — Cours de Qor'an</title>
<style>body{font-family:Arial,sans-serif;background:#f3f6f4;margin:0;color:#18231d}.wrap{max-width:720px;margin:25px auto;padding:15px}.card{background:#fff;padding:26px;border-radius:18px;box-shadow:0 8px 28px #0001}h1{text-align:center;font-size:25px}p{text-align:center;color:#68736d}label{display:block;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;padding:12px;box-sizing:border-box;border:1px solid #ccd5cf;border-radius:9px;font-size:15px}textarea{min-height:85px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:10px;background:#173b2a;color:#fff;font-size:16px;font-weight:bold}#fiche{display:none}.line{padding:10px 0;border-bottom:1px solid #eee}.actions{display:flex;gap:10px}.actions button{flex:1}@media(max-width:600px){.grid{grid-template-columns:1fr}}@media print{.form{display:none}.card{box-shadow:none}}</style></head>
<body><div class="wrap"><div class="card form"><h1>📖 Inscription — Cours de Qor'an en ligne</h1><p>Remplissez le formulaire pour participer aux cours.</p>
<form id="f"><div class="grid"><div><label>Nom et prénom *</label><input name="nom" required></div><div><label>Âge *</label><input name="age" type="number" min="5" max="100" required></div></div>
<div class="grid"><div><label>WhatsApp *</label><input name="whatsapp" type="tel" required></div><div><label>E-mail</label><input name="email" type="email"></div></div>
<div class="grid"><div><label>Pays *</label><input name="pays" required></div><div><label>Ville</label><input name="ville"></div></div>
<label>Niveau en lecture du Qor'an *</label><select name="niveau" required><option value="">Choisir...</option><option>Débutant(e)</option><option>Je connais les lettres arabes</option><option>Je lis avec des difficultés</option><option>Je lis correctement</option><option>Je souhaite améliorer ma lecture</option><option>Je souhaite apprendre la mémorisation</option></select>
<label>Disponibilités</label><textarea name="dispo" placeholder="Ex. lundi et jeudi à 19h"></textarea><label>Message / précision</label><textarea name="message"></textarea>
<button>✅ Valider mon inscription</button></form></div>
<div class="card" id="fiche"><h2 style="text-align:center">FICHE D'INSCRIPTION</h2><div id="out"></div><div class="actions"><button onclick="window.print()">📄 Télécharger / enregistrer en PDF</button><button onclick="location.reload()">Nouvelle inscription</button></div></div></div>
<script>const e=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));document.getElementById('f').onsubmit=x=>{x.preventDefault();let d=Object.fromEntries(new FormData(x)),id='QOR-'+Date.now().toString().slice(-8),date=new Date().toLocaleDateString('fr-FR');document.querySelector('.form').style.display='none';document.getElementById('fiche').style.display='block';document.getElementById('out').innerHTML=`<p><b>Cours de Qor'an en ligne</b></p><div class=line><b>N° d'inscription :</b> ${id}</div><div class=line><b>Nom :</b> ${e(d.nom)}</div><div class=line><b>Âge :</b> ${e(d.age)}</div><div class=line><b>WhatsApp :</b> ${e(d.whatsapp)}</div><div class=line><b>E-mail :</b> ${e(d.email)||'—'}</div><div class=line><b>Pays / Ville :</b> ${e(d.pays)} / ${e(d.ville)||'—'}</div><div class=line><b>Niveau :</b> ${e(d.niveau)}</div><div class=line><b>Disponibilités :</b> ${e(d.dispo)||'—'}</div><div class=line><b>Message :</b> ${e(d.message)||'—'}</div><div class=line><b>Date :</b> ${date}</div><p style="margin-top:35px">Signature : ________________________</p>`}</script></body></html>
